services:
  app:
    restart: unless-stopped
    image: vabene1111/recipes:2.6.13@sha256:f6c58afdea7a721d079ebd6ee5483f2c9da77dd1e709e16d60a82c218e80a451
    env_file:
      - ./.env
    environment:
      GUNICORN_WORKERS: "1"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --header='Host: ${COMPOSE_PROJECT_NAME}.timkley.dev' http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - staticfiles:/opt/recipes/staticfiles
      - ./mediafiles:/opt/recipes/mediafiles
      - ./database/db.sqlite3:/opt/recipes/db.sqlite3
    depends_on:
      - db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${COMPOSE_PROJECT_NAME}.timkley.dev`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=lets-encrypt"
    networks:
      - web
      - default

  db:
    restart: unless-stopped
    image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    volumes:
      - ./postgresql:/var/lib/postgresql/data
    env_file:
      - ./.env

networks:
  web:
    external: true

volumes:
  staticfiles:
