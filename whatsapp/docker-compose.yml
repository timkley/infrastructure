services:
  app:
    container_name: whatsapp-app
    image: heisenberg-whatsapp:0.20.0
    build: .
    restart: unless-stopped
    init: true
    user: "${WHATSAPP_UID:-1000}:${WHATSAPP_GID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    volumes:
      - ./data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "python", "/usr/local/lib/whatsapp/healthcheck.py"]
      interval: 60s
      timeout: 20s
      start_period: 120s
      retries: 3
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=false"
