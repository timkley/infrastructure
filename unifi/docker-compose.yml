services:
  app:
    image: "lscr.io/linuxserver/unifi-network-application:10.6.106-ls150@sha256:18a3a1dd05c3c265311f81452d7cd6cb51927d05864dca07a1a5aeff32cb6c5a"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - web
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Berlin
      MONGO_USER: unifi
      MONGO_PASS: "${MONGO_PASS:?Set MONGO_PASS in unifi/.env}"
      MONGO_HOST: db
      MONGO_PORT: "27017"
      MONGO_DBNAME: unifi
      MONGO_AUTHSOURCE: admin
      MEM_STARTUP: "512"
      MEM_LIMIT: "1024"
    volumes:
      - config:/config
      - ./backup:/config/data/backup
    ports:
      # The adopted APs use the public IPv4 endpoints below. TCP 8080 is
      # restricted to Cloudflare source networks by the firewall unit.
      - "0.0.0.0:3478:3478/udp" # STUN
      - "0.0.0.0:8080:8080/tcp" # Device/controller communication
    healthcheck:
      test:
        - CMD-SHELL
        - "curl --fail --silent --insecure https://127.0.0.1:8443/status | grep -q '\"up\":true'"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-secure.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-secure.rule=Host(`${COMPOSE_PROJECT_NAME}.timkley.dev`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-secure.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-secure.tls.certresolver=lets-encrypt"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-secure.service=${COMPOSE_PROJECT_NAME}"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=8443"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.scheme=https"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.serverstransport=insecureskipverify@file"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-compress.compress=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-secure.middlewares=${COMPOSE_PROJECT_NAME}-compress"
      # UniFi devices use /inform for controller communication. Route it to
      # port 8080 instead of the GUI/API service on port 8443.
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-inform.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-inform.rule=Host(`${COMPOSE_PROJECT_NAME}.timkley.dev`) && Path(`/inform`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-inform.priority=100"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-inform.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-inform.tls.certresolver=lets-encrypt"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-inform.service=${COMPOSE_PROJECT_NAME}-inform"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-inform.loadbalancer.server.port=8080"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-inform.loadbalancer.server.scheme=http"

  db:
    image: "mongo:8.0.34-noble@sha256:2711bb79d785c58ce13a8f97e082539d40d65fe7810268b33f12fc68757af48d"
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USER:?Set MONGO_ROOT_USER in unifi/.env}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASS:?Set MONGO_ROOT_PASS in unifi/.env}"
      MONGO_USER: unifi
      MONGO_PASS: "${MONGO_PASS:?Set MONGO_PASS in unifi/.env}"
      MONGO_DBNAME: unifi
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin
          --eval 'db.adminCommand({ping: 1}).ok' | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - mongodb:/data/db
      - ./init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro

volumes:
  config:
  mongodb:

networks:
  web:
    external: true
